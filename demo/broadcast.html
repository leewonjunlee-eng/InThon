<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>모의 중계</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0; background: #15151d; color: #f2f1fa; display: grid; place-items: center; min-height: 100vh; }
  main { width: min(640px, 92vw); display: grid; gap: 12px; }
  video, audio { width: 100%; }
  video { border-radius: 12px; background: #30305a; }
  #banner { position: fixed; inset: 0; display: grid; place-items: center; background: #c81e3a; color: #fff; font-size: 56px; font-weight: 700; text-align: center; }
  #banner[hidden] { display: none; }
</style>
<main>
  <h1 id="title"></h1>
  <div id="banner" hidden>PENTA KILL! BARON SLAIN</div>
  <video id="screen" muted playsinline></video>
  <audio id="player" controls loop></audio>
  <p>재생한 뒤 툴바의 Catch Sound를 열어 이 탭을 연결하세요.</p>
</main>
<script>
  const kind = new URLSearchParams(location.search).get("f") === "lecture" ? "lecture" : "lol";
  const name = kind === "lol" ? "LCK 모의 중계" : "운영체제 강의";
  document.title = name;
  document.getElementById("title").textContent = name;
  // 연습용 화면. 소형 플레이어와 화면 감지를 시험할 수 있도록 실제 영상 요소로 그린다.
  const canvas = Object.assign(document.createElement("canvas"), { width: 640, height: 360 });
  const paint = canvas.getContext("2d");
  const player = document.getElementById("player");
  const screen = document.getElementById("screen");
  function draw() {
    const moment = kind === "lol" && player.currentTime > 21 && player.currentTime < 31;
    document.getElementById("banner").hidden = !moment;
    paint.fillStyle = moment ? "#c81e3a" : "#30305a";
    paint.fillRect(0, 0, 640, 360);
    paint.fillStyle = "#fff";
    paint.textAlign = "center";
    paint.font = "bold 44px sans-serif";
    paint.fillText(moment ? "PENTA KILL! BARON SLAIN" : kind === "lol" ? "BLUE 3 : 2 RED" : "교착 상태", 320, 190);
  }
  draw();
  setInterval(draw, 200);
  screen.srcObject = canvas.captureStream(5);
  screen.play();
  document.getElementById("player").src = `sample/${kind}.wav`;
</script>
</html>
